name: ASE Server Docker CI With Server Base

on:
  push:
    tags:
      - 'base-*'

jobs:
  # 正式版方舟服务器基础镜像
  ASE-Server:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build the Base Docker image (Release)
      run: cd ASE-Server-base && docker build . --file dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/ase-server-base:steamcmd
    
    - name: Push Base Docker images (Release)
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/ase-server-base:steamcmd
    
    # 最终镜像
    - name: Build the Server Docker image (Release)
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        docker build . --file dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:latest -t ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:$TAG
    
    - name: Push Server Docker images (Release)
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:$TAG

  # 测试版方舟服务器基础镜像 (Beta Preaquatica)
  ASE-Server-Preaquatica:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build the Base Docker image (preaquatica)
      run: cd ASE-Server-base && docker build . --file dockerfile --build-arg USE_BETA=true -t ${{ secrets.DOCKERHUB_USERNAME }}/ase-server-base:steamcmd-preaquatica
    
    - name: Push Base Docker images (preaquatica)
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/ase-server-base:steamcmd-preaquatica
    
    # 最终镜像 (preaquatica)
    - name: Build the Server Docker image (preaquatica)
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        docker build . --file dockerfile.preaquatica -t ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:preaquatica -t ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:$TAG-preaquatica
    
    - name: Push Server Docker images (preaquatica)
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:preaquatica
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:$TAG-preaquatica