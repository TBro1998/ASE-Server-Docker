name: ASE Server Docker CI

on:
  push:
    tags:
      - 'v*'

jobs:
  # 正式版最终镜像
  ASE-Server:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build the Docker image (Release)
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        docker build . --file dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:latest -t ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:$TAG
    
    - name: Push Docker images (Release)
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:$TAG

  # 测试版最终镜像 (Beta Preaquatica)
  ASE-Server-Preaquatica:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build the Docker image (preaquatica)
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        docker build . --file dockerfile.preaquatica -t ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:preaquatica -t ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:$TAG-preaquatica
    
    - name: Push Docker images (preaquatica)
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:preaquatica
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:$TAG-preaquatica