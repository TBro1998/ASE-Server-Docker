name: ASE Server Docker CI

# 同一个 dockerfile 构建两个镜像（--target）：
#   linux   原生 Linux 版服务端              tbro98/ase-server:linux、:<tag>-linux
#   proton  GE-Proton 运行 Windows 版（ArkApi） tbro98/ase-server:proton、:<tag>-proton
# latest 不再更新：它停留在最后一个自带 ArkApi 的版本，给还在使用 latest 的旧版管理端。
# 正式版和 preaquatica 版的区别只是 APP_UPDATE 环境变量，服务端文件在容器首次启动时才下载，运行时指定分支即可

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}

    steps:
    - uses: actions/checkout@v7

    # - name: Free disk space
    #   uses: jlumbroso/free-disk-space@main
    #   with:
    #     tool-cache: true
    #     android: true
    #     dotnet: true
    #     haskell: true
    #     large-packages: true
    #     docker-images: true
    #     swap-storage: true

    - name: Get tag name
      id: vars
      run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build the Docker images (Release)
      run: |
        for target in linux proton; do
          docker build . --file dockerfile --target "$target" \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:$target \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:${{ steps.vars.outputs.tag }}-$target
        done

    - name: Push Docker images (Release)
      run: |
        for target in linux proton; do
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:$target
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:${{ steps.vars.outputs.tag }}-$target
        done

  # 镜像推送成功后再发布 Release，保证 Release 里写的 tag 一定有对应的镜像
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Prepare release notes
      env:
        TAG: ${{ needs.build.outputs.tag }}
        IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ase-server
      run: |
        # actions/checkout 只把 tag 指向的提交取下来，附注 tag 对象会丢失，单独取一次
        git fetch --force --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
        : > release-notes.md
        if [ "$(git cat-file -t "$TAG")" = tag ]; then
          git tag -l --format='%(contents:body)' "$TAG" > release-notes.md
        fi
        if [ -s release-notes.md ]; then
          echo >> release-notes.md
        fi
        {
          echo '## 镜像'
          echo
          echo '```'
          echo "${IMAGE}:${TAG}-linux"
          echo "${IMAGE}:${TAG}-proton"
          echo "${IMAGE}:linux"
          echo "${IMAGE}:proton"
          echo '```'
        } >> release-notes.md
        cat release-notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ needs.build.outputs.tag }}
        # v0.1.1-b1 这类带后缀的当作预发布，不出现在 /releases/latest 里
        prerelease: ${{ contains(needs.build.outputs.tag, '-') }}
        body_path: release-notes.md
