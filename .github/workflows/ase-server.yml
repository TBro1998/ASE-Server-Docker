name: ASE Server Docker CI

# 只有一个镜像：正式版和 preaquatica 版的区别只是 APP_UPDATE 环境变量，
# 服务端文件在容器首次启动时才下载，运行时指定分支即可

on:
  push:
    tags:
      - 'v*'

jobs:
  ASE-Server:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # - name: Free disk space
    #   uses: jlumbroso/free-disk-space@main
    #   with:
    #     tool-cache: true
    #     android: true
    #     dotnet: true
    #     haskell: true
    #     large-packages: true
    #     docker-images: true
    #     swap-storage: true
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build the Docker image (Release)
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        docker build . --file dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:latest -t ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:$TAG
    
    - name: Push Docker images (Release)
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ase-server:$TAG
